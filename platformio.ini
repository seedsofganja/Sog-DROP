; SOG-Drop - firmware ESP32 per la fertirrigazione automatica
; Compilare e caricare con PlatformIO (estensione VS Code).

[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    bogde/HX711@^0.7.5
    adafruit/RTClib@^2.1.4
